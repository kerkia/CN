# « Virtually »'s events (owner, 2026-11-11): the races organisers make from their own OCAD map, and administrators from the
# LiDAR alone, built here — Coach › Virtually › Orga asks for a build (functions/api/virtual/events: R2 virtual-build/<id>.json)
# and starts this workflow (workflow_dispatch, GH_DISPATCH_TOKEN); tools/virtually/ci.py makes each package (dump.mjs, build.py,
# the courses; IGN's LiDAR HD under a French map; mapgen's tiles for a race from the LiDAR alone) into R2 virtual-ev/<id>/,
# writes its progress into the request as it goes, and marks the event ready or failed. Runs never overlap; each run takes the
# builds waiting, again until none is left.
#
# The organisers' maps are read from R2 and never kept anywhere else: the work folder goes with the runner.
# karttapullautin (GPL-3), for the LiDAR-only races, is downloaded from its own release and checked, as in lidarmap.yml.

name: virtually

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    concurrency:
      group: virtually
      cancel-in-progress: false
    env:
      BUCKET: s3://cn-state
      R2: https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
      AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
      KP_VERSION: "2.15.4"
      KP_SHA256: daf256834818d17dc1a0b2cbae289e96e0c88a2f7bd1ec818c15fb1df5e67b6d
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - run: pip install "httpx>=0.27" "numpy>=2.0" "pillow>=11" "scipy>=1.14" "pyproj>=3.7" "requests>=2.31" "laspy[lazrs]>=2.5" "apsw>=3.46" "rasterio>=1.4" "shapely>=2.0"

      # dump.mjs reads Mapper's files through xmldom (tools/mapper/shim.mjs)
      - run: npm ci --prefix tools/mapper --no-audit --no-fund

      # the events' thumbnails: thumb.mjs draws the map with the site's renderer in the runner's Chrome
      - run: npm ci --prefix tools/virtually --no-audit --no-fund && echo "CHROME=$(command -v google-chrome || command -v chromium)" >> "$GITHUB_ENV"

      - name: karttapullautin
        run: |
          curl -sSfL -o "$RUNNER_TEMP/kp.tgz" "https://github.com/karttapullautin/karttapullautin/releases/download/v$KP_VERSION/karttapullautin-x86_64-linux.tar.gz"
          echo "$KP_SHA256  $RUNNER_TEMP/kp.tgz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/kp" && tar -xzf "$RUNNER_TEMP/kp.tgz" -C "$RUNNER_TEMP/kp"
          echo "KP=$(find "$RUNNER_TEMP/kp" -type f -name pullauta | head -1)" >> "$GITHUB_ENV"

      - name: Races
        run: |
          export CN_DATA_DIR="$RUNNER_TEMP/data" && mkdir -p "$CN_DATA_DIR"
          for round in 1 2 3 4; do
            rm -rf "$RUNNER_TEMP/req" && mkdir -p "$RUNNER_TEMP/req"
            aws s3 sync "$BUCKET/virtual-build/" "$RUNNER_TEMP/req/" --endpoint-url "$R2" --only-show-errors || true
            [ -n "$(ls -A "$RUNNER_TEMP/req")" ] || break
            python tools/virtually/ci.py --reqs "$RUNNER_TEMP/req" --work "$RUNNER_TEMP/work" --kp "$KP"
            rm -rf "$RUNNER_TEMP/work/lidarcache" "$RUNNER_TEMP/work/mapgen/work/laz" "$RUNNER_TEMP"/work/mapgen/work/*/out "$RUNNER_TEMP"/work/mapgen/work/mnt_*.tif
          done
