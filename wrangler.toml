# Cloudflare Pages project "observatoire-cn": static site in site/, Functions in functions/.
# Secrets (never in this file), set with `wrangler pages secret put <NAME> --project-name observatoire-cn`:
#   SESSION_SECRET  signs the session cookie (and peppers the password hashes)
#   RESEND_API_KEY  sends the e-mails (confirmation, reset, alerts, digests)
#   NOTIFY_SECRET   lets update.py call /api/notify from the PC
#   GH_DISPATCH_TOKEN  starts a provisional-results run after an upload (GitHub fine-grained token, repository
#                      kerkia/CN, "Actions: read and write"); without it, uploads wait for the next hourly run
name = "observatoire-cn"
pages_build_output_dir = "site"
compatibility_date = "2025-06-01"

[[d1_databases]]
binding = "DB"
database_name = "ocn"
database_id = "3bf072a7-0c47-41df-96f0-8943031547fd"
migrations_dir = "migrations"

# the state bucket of the CI runs; the Functions only ever write under uploads/ (organisers' files, api/upload.js)
[[r2_buckets]]
binding = "BUCKET"
bucket_name = "cn-state"

# Ozimut's live relay (live/, Worker « ocn-live », deployed by hand: cd live && npx wrangler deploy): its race objects — liveresultat's races for « En direct » (functions/ws/[comp].js) and the
# organisers' broadcasts (« Organisation › Direct », functions/api/live/push.js) — and its directory (liveresultat's list,
# functions/api/live/list.js; the broadcasts); the pushes reach them at internal paths no public route forwards
[[durable_objects.bindings]]
name = "LIVE_RACE"
class_name = "LiveRace"
script_name = "ocn-live"

[[durable_objects.bindings]]
name = "LIVE_DIR"
class_name = "Directory"
script_name = "ocn-live"

# Workers AI (« IA », functions/api/ask.js): the language model that writes a query for a question; free plan, 10 000
# neurons a day for the whole account, the calls fail past it (nothing billed)
[ai]
binding = "AI"

[vars]
SITE_URL = "https://ozimut.com"
# the former addresses (2026-10-19): they keep serving the site, and their pages send visitors on to SITE_URL with their
# session and settings (assets/js/bridge.js, functions/api/account/handoff.js)
OLD_HOSTS = "ocn.kerkia.com"
# push notifications (functions/_lib/push.js): the site's public VAPID key, made with its private one (a Pages secret,
# VAPID_PRIVATE_KEY) by tools/vapid.mjs
VAPID_PUBLIC_KEY = "BCBEutwc9rhl-JARIchi73P0mqGNf0hJ2LG-7mU9n9clyEs9SLIlERGRKfxGFIYWs2mzybCtd2jjOYCzyhVNzns"
MAIL_FROM = "alert@ozimut.com"
# where replies to the automatic mails go (a mailbox read by hand, Proton); a mail that names its own Reply-To keeps it
REPLY_TO = "contact@ozimut.com"
MAIL_FROM_NAME = "Ozimut"
# who gets the duplicate-licence alerts, and which accounts see the admin page
ALERT_EMAIL = "contact@ozimut.com"
ADMIN_EMAILS = "ocn@kerkia.com, admin@ozimut.com"
# "1" opens registration; "0" closes it
REGISTRATION_OPEN = "1"
# "1": registration without France (the countries, migration 0014); "0" until the site's access follows the countries
WORLD_OPEN = "0"
# Cloudflare Turnstile on registration (_lib/turnstile.js): the widget's public site key; its secret is the Pages secret
# TURNSTILE_SECRET. Empty (or no secret): no check
TURNSTILE_SITE_KEY = "0x4AAAAAAFd6fB1Pb8PZvPneZYJkYdKxhBY"
# the repository whose workflow an upload starts
GH_REPO = "kerkia/CN"
# Resend free plan: 100 e-mails a day and 3 000 a month; what does not fit is sent the next day
DAILY_EMAIL_LIMIT = "90"
MONTHLY_EMAIL_LIMIT = "2900"
# of the day's quota, this many e-mails are kept for account mails (confirmation, reset): digests stop short of it
ACCOUNT_EMAIL_RESERVE = "20"
# the free Workers plan gives ~10 ms of CPU per request: a light PBKDF2 (the pepper makes up for it)
PBKDF2_ITER = "20000"
