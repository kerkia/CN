<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <style>.f { fill: #1b1a17; } .o { fill: none; stroke: #1b1a17; }
    @media (prefers-color-scheme: dark) { .f { fill: #f4f2ec; } .o { stroke: #f4f2ec; } }</style>
  <!-- Ozimut: a compass bezel, the control flag's two quarters as its needle (bearing 45°) -->
  <path d="M16 8 L24 16 L16 16 Z" fill="#e8641c"/>
  <path class="f" d="M8 16 L16 24 L16 16 Z"/>
  <!-- the ring and its ticks last, over everything -->
  <circle class="o" cx="16" cy="16" r="13.7" stroke-width="1.9"/>
  <path class="o" d="M16 3.4 V5.6 M28.6 16 H26.4 M16 28.6 V26.4 M3.4 16 H5.6" stroke-width="2" stroke-linecap="round"/>
</svg>
