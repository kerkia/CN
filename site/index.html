  <script>
    // Apply the theme before first paint so there is no flash: the one chosen under the moon button (five, from
    // Clair to Nuit: app.js THEMES), else (owner, 2026-10-12) light on a computer, dark on a phone — whatever the
    // system's own setting.
    let t = null;
    try { t = localStorage.getItem("cnx.theme"); } catch (e) {}
    // the themes' first names, for a few hours on 2026-10-13
    if (t === "paper") t = "clearing"; else if (t === "forest") t = "undergrowth"; else if (t === "dusk") t = "forest";
    if (!["light", "clearing", "forest", "undergrowth", "dark"].includes(t)) t = matchMedia("(pointer: coarse) and (max-width: 900px)").matches ? "dark" : "light";
    document.documentElement.dataset.theme = t;
  </script>
